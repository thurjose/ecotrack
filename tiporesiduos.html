<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  </head>
  <body>
    <header class="head">
      <div class="logo">
        <a href="index.html"><img src="image.png" alt="EcoTrack logo" /></a>
        <a href="index.html">EcoTrack</a>
      </div>
      <nav class="nav">
        <a href="usuario.html">Usuários</a>
        <a href="organizacao.html">Organizações</a>

      </nav>
    </header>

    <main class="page">
      <h1>Tipo de resíduo</h1>

      <div class="crud-layout">
        <form id="form-residuo" class="form-card">
          <div class="form-card__header">Novo tipo de resíduo</div>
          <div class="form-card__body">
            <input type="hidden" id="campo-id-editando" />

            <label>
              Nome (até 50 caracteres)
              <input type="text" id="campo-nome" maxlength="50" />
            </label>

            <label>
              <input type="checkbox" id="campo-reciclavel" />
              É reciclável
            </label>

            <label>
              <input type="checkbox" id="campo-perigoso" />
              É perigoso
            </label>

            <button type="submit" class="btn-primary">Adicionar</button>
          </div>
        </form>

        <div class="list-card">
          <div id="area-lista"></div>
        </div>
      </div>
    </main>

    <script src="tiporesiduos.js"></script>
  </body>
</html>
