<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizações</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Organizações</h1>

    <input type="text" id="nome" placeholder="Nome da Organização">
    <select id="tipoOrganizacao">
        <option value="" disabled selected hidden>Tipo de Organização</option>
        <option value="cooperativa">Cooperativa</option>
        <option value="empresaColeta">Empresa de Coleta</option>
        <option value="servicoMunicipal">Serviço Municipal</option>
        <option value="coletorParceiro">Coletor Parceiro</option>
        <option value="ong">ONG</option>
    </select>


    <input type="tel" id="telefone" placeholder="(99) 99999-9999">

    <input type="email" id="email" placeholder="E-mail da Organização">

    <input type="text" id="areaAtuacao" placeholder="Área de atuação">

    <select id="situacaoOrganizacao">
        <option value="" disabled selected hidden>Situação da Organização</option>
        <option value="ativa">Ativa</option>
        <option value="inativa">Inativa</option>
        <option value="suspensa">Suspensa</option>
    </select>

    <button type="button" onclick="salvar()">Salvar</button>
    <span id="msg"></span>

    <div id="lista"></div>

    <script src="organizacao.js
    "></script>

</body>

</html>
