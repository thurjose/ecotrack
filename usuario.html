<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Usuários</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  </head>
  <body>
    <header class="head">
      <div class="logo">
        <a href="index.html"><img src="image.png" alt="EcoTrack logo" /></a>
        <a href="index.html">EcoTrack</a>
      </div>
      <nav class="nav">
        <a href="usuario.html" class="active">Usuários</a>
        <a href="organizacao.html">Organizações</a>
        <a href="veiculos.html">Veículos</a>
        <a href="atendimento.html">Atendimento</a>
        <a href="tiporesiduos.html">Tipo de Resíduo</a>
      </nav>
    </header>

    <main class="page">
      <h1>Usuários</h1>

      <div class="crud-layout">
        <div class="form-card">
          <div class="form-card__header">Novo usuário</div>
          <div class="form-card__body">
            <input type="text" id="nome" placeholder="Nome" />
            <input type="text" id="email" placeholder="E-mail" />
            <input type="text" id="telefone" placeholder="Telefone" />
            <select id="tipo">
              <option value="" disabled selected hidden>Tipo de Usuário</option>
              <option value="cidadao">Cidadão</option>
              <option value="organizacao">Organização</option>
            </select>
            <select id="situacao">
              <option value="" disabled selected hidden>Situação da Conta</option>
              <option value="ativa">Ativa</option>
              <option value="inativa">Inativa</option>
            </select>

            <button type="button" class="btn-primary" onclick="salvar()">Salvar</button>
            <span id="msg"></span>
          </div>
        </div>

        <div class="list-card">
          <div id="lista"></div>
        </div>
      </div>
    </main>

    <script src="usuario.js"></script>
  </body>
</html>
