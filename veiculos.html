<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Veículos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="head">
      <div class="logo">
        <a href="index.html"><img src="image.png" alt="EcoTrack logo" /></a>
        <a href="index.html">EcoTrack</a>
      </div>
      <nav class="nav">
        <a href="usuario.html">Usuários</a>
        <a href="organizacao.html">Organizações</a>
        <a href="veiculos.html" class="active">Veículos</a>
        <a href="atendimento.html">Atendimento</a>
        <a href="tiporesiduos.html">Tipo de Resíduo</a>
      </nav>
    </header>

    <h1>Cadastro de veículos</h1>
    <input type="text" id="identificacao" placeholder="identificação (placa)" />
    <input type="number" id="capacidade" placeholder="capacidade (kg)" />
    <input type="text" id="tipo_veiculo" placeholder="tipo de veículo" />

    <select id="id_organizacao">
      <option value="1">Cooperativa Central</option>
      <option value="2">EcoTrack</option>
    </select>

    
    <select id="situacao_veiculo">
      <option value="Disponível">Disponivel</option>
      <option value="Em rota">Em rota</option>
      <option value="Manutencao">Manutenção</option>
    </select>
    <button type="button" onclick="salvar()">salvar</button>

    <div id="lista"></div>

    <script src="veiculos.js"></script>
  </body>
</html>
