<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>CRUD Atendimento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <h1>Atendimentos</h1>
 
  <form id="form-atendimento">
    <input type="hidden" id="campo-id-editando">
 
    <label>ID Organização:
      <input type="number" id="campo-id-organizacao" required>
    </label>
    <br>
 
    <label>ID Ocorrência:
      <input type="number" id="campo-id-ocorrencia" required>
    </label>
    <br>
 
    <label>ID Veículo:
      <input type="number" id="campo-id-veiculo" required>
    </label>
    <br>
 
    <label>Data de aceite:
      <input type="datetime-local" id="campo-data-aceite">
    </label>
    <br>
 
    <label>Data de início:
      <input type="datetime-local" id="campo-data-inicio">
    </label>
    <br>
 
    <label>Data de conclusão:
      <input type="datetime-local" id="campo-data-conclusao">
    </label>
    <br>
 
    <label>Resultado do atendimento:
      <input type="text" id="campo-resultado" maxlength="30">
    </label>
    <br>
 
    <button type="submit">Salvar</button>
  </form>
 
  <hr>
 
  <div id="area-lista"></div>
 
  <script src="main.js"></script>
</body>
</html>
