<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>CRUD Atendimento</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  </head>
  <body>
    <header class="head">
      <div class="logo">
        <a href="index.html"><img src="image.png" alt="EcoTrack logo" /></a>
        <a href="index.html">EcoTrack</a>
      </div>
      <nav class="nav">
        <a href="usuario.html">Usuários</a>
        <a href="organizacao.html">Organizações</a>
        <a href="veiculos.html">Veículos</a>
        <a href="atendimento.html" class="active">Atendimento</a>
        <a href="tiporesiduos.html">Tipo de Resíduo</a>
      </nav>
    </header>

    <main class="page">
      <h1>Atendimentos</h1>

      <div class="crud-layout">
        <form id="form-atendimento" class="form-card">
          <div class="form-card__header">Novo atendimento</div>
          <div class="form-card__body">
            <input type="hidden" id="campo-id-editando" />

            <label>
              ID Organização:
              <input type="number" id="campo-id-organizacao" required />
            </label>

            <label>
              ID Ocorrência:
              <input type="number" id="campo-id-ocorrencia" required />
            </label>

            <label>
              ID Veículo:
              <input type="number" id="campo-id-veiculo" required />
            </label>

            <label>
              Data de aceite:
              <input type="datetime-local" id="campo-data-aceite" />
            </label>

            <label>
              Data de início:
              <input type="datetime-local" id="campo-data-inicio" />
            </label>

            <label>
              Data de conclusão:
              <input type="datetime-local" id="campo-data-conclusao" />
            </label>

            <label>
              Resultado do atendimento:
              <input type="text" id="campo-resultado" maxlength="30" />
            </label>

            <button type="submit" class="btn-primary">Salvar</button>
          </div>
        </form>

        <div class="list-card">
          <div id="area-lista"></div>
        </div>
      </div>
    </main>

    <script src="atendimento.js"></script>
  </body>
</html>
